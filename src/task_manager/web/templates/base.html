<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Engineering tasks{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: "Iowan Old Style", Palatino, Georgia, serif; }
    body { margin: 0 auto; max-width: 42rem; padding: 2rem 1.25rem 4rem; line-height: 1.45; color: #1c1915; background: #f7f4ee; }
    a { color: #1f4b3a; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    .status { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 999px; background: #e4efe8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.85rem; }
    .message { background: #fff4d6; border: 1px solid #e0c36a; padding: 0.75rem 1rem; margin: 1rem 0; }
    form { margin: 0.5rem 0 1rem; }
    label { display: block; margin-top: 0.5rem; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.9rem; }
    input[type="text"], textarea, select { width: 100%; box-sizing: border-box; padding: 0.45rem 0.5rem; border: 1px solid #c9c1b2; background: white; }
    button, .button { font-family: ui-sans-serif, system-ui, sans-serif; background: #1f4b3a; color: white; border: 0; padding: 0.45rem 0.75rem; cursor: pointer; }
    .secondary { background: transparent; color: #1f4b3a; border: 1px solid #1f4b3a; }
    ul.tasks, ol.history { padding-left: 1.2rem; }
    li { margin: 0.35rem 0; }
    .muted { color: #5c564c; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.92rem; }
    .criterion { border-top: 1px solid #e3dccf; padding-top: 0.75rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <p><a href="/">All tasks</a></p>
  {% block body %}{% endblock %}
</body>
</html>
